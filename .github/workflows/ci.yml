# Continuous integration — the same workflow documented in CONTRIBUTING.md:
# install (frozen lockfile), typecheck, build, test. Runs on every push to
# main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: check / build / test — Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Build
        run: bun run build

      - name: Test
        # node:test drives the real typescript-language-server; the runner
        # downloads its TypeScript engine on first use.
        run: bun run test

      - name: Assert package contents
        # Mirrors prepack: fail the build if the published file set is wrong.
        run: node tools/assert-package-files.mjs

  # A lightweight verification that the committed lib/ distribution is still in
  # the file list contract — fast feedback on packaging mistakes.
  package:
    name: npm pack (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: npm pack --dry-run (runs prepack assertion)
        run: npm pack --dry-run
