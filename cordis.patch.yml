# Code-Intel plugin patch for DeepSeek Harness
# This plugin provides IDE-like code intelligence capabilities

- id: code-intel-plugin
  name: "@deepseek-ai/code-intel"
  config:
    plugin:
      title: "Code-Intel: Code Intelligence Plugin"
      description: "IDE-like code intelligence for coding agents: symbol search, file operations, refactoring, memory management, and diagnostics"
      version: "0.1.0"
      capabilities:
        - symbol_search
        - file_operations
        - symbolic_editing
        - memory_management
        - diagnostics
      operations:
        - find_symbol
        - find_referencing_symbols
        - find_implementations
        - get_symbols_overview
        - list_dir
        - read_file
        - create_text_file
        - replace_content
        - rename_symbol
        - move_symbol
        - safe_delete_symbol
        - inline_symbol
        - write_memory
        - read_memory
        - list_memories
        - delete_memory
        - rename_memory
        - edit_memory
        - get_diagnostics
      platforms: [web]
      defaultContext: "code-intel"