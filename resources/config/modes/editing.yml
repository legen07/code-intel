# Editing mode configuration for code-intel
mode: editing
description: "Mode for code editing and refactoring operations"

enabledTools:
  - rename_symbol
  - move_symbol
  - safe_delete_symbol
  - inline_symbol
  - replace_content
  - create_text_file

disabledTools: []

configuration:
  defaultMode: "literal"
  allowMultipleReplacements: false
  preserveComments: true