# Query projects mode configuration for code-intel
mode: query-projects
description: "Mode for querying and searching across projects"

enabledTools:
  - find_symbol
  - get_symbols_overview
  - list_dir
  - read_file

disabledTools: []

configuration:
  defaultSearchScope: "project"
  includeDependencies: false
  filePatterns: ["*.js", "*.ts", "*.py", "*.java", "*.cpp", "*.c", "*.go", "*.rs"]